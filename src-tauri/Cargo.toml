[package]
name = "nanobox"
version = "0.1.0"
description = "Nanobox — a fully customisable desktop companion built for neurodivergent people"
authors = ["Aagam Shah"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nanobox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# Auto-update from GitHub Releases (see src/core/updater.ts, docs/RELEASING.md)
# and process::relaunch to restart into the new version afterwards.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Island + routines (see src/island/, src-tauri/src/clipboard.rs, wallpaper.rs).
tauri-plugin-global-shortcut = "2"
# Clipboard history: reading/writing text cross-platform. Change detection and
# skipping password-manager content are done natively per OS in clipboard.rs.
arboard = { version = "3", default-features = false }
# Desktop wallpaper switching from the island's Wallpapers tab.
wallpaper = "3"
# Wallpaper thumbnails (island) and, on macOS, album-art downscaling.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# sync-secret-service is the Linux D-Bus backend — excluded here because we
# only target Windows and macOS, and it adds compile time and binary weight on
# both platforms without doing anything. Add it back if Linux support ships.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
base64 = "0.23.1"

# Icon extraction (Part A of the "Error 6" fix) is Windows-only for now — see
# src-tauri/src/icons.rs. windows-icons pulls in the `windows` crate's Win32
# bindings, which don't link on non-Windows targets, so it's scoped to a
# target-specific dependency table rather than the shared [dependencies].
[target.'cfg(target_os = "windows")'.dependencies]
windows-icons = "0.4.0"

# System media-session reading ("Error 7/8" fix) is also Windows-only for now
# — see src-tauri/src/system_media.rs. Kept as its own table (rather than
# merged into the one above) since `cfg(windows)` and `cfg(target_os =
# "windows")` are different predicate strings even though both match the
# same platform; Cargo merges dependencies from every matching target table.
[target."cfg(windows)".dependencies]
pollster = "1.0.1"
windows = { version = "0.62.2", features = ["Media_Control", "Foundation", "Storage_Streams", "Win32_System_Com", "Win32_System_DataExchange"] }
windows-future = "0.3.2"

# System media-session reading on macOS — see src-tauri/src/system_media.rs.
# media-remote wraps the private MediaRemote framework and, on macOS 15.4+,
# reads it through the bundled mediaremote-adapter (run by /usr/bin/perl).
# `image` (shared, above) downscales + PNG-encodes the album cover it returns;
# it must stay on the same 0.25 line media-remote uses. objc2-app-kit is used
# by clipboard.rs to skip password-manager clipboard content.
[target.'cfg(target_os = "macos")'.dependencies]
media-remote = "0.5.1"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString"] }

# ── Build profiles ────────────────────────────────────────────────────────────

[profile.release]
# Strip debug symbols → smaller installer binary (often halves binary size).
strip = true
# Link-time optimisation: "thin" is a good balance — meaningfully smaller than
# none, much faster than "fat". Inlines across crates and removes dead code
# that wouldn't be visible inside a single compilation unit.
lto = "thin"
# One codegen unit lets LLVM see the whole crate at once for better
# optimisation and smaller output; slower to compile but only runs in CI.
codegen-units = 1
# Abort on panic instead of unwinding — removes the unwinder from the binary.
# Tauri itself uses this in its own release builds.
panic = "abort"
# opt-level 3 (speed) is the default; "z" optimises purely for size at the
# cost of some runtime speed. For a widget hub that's mostly waiting for
# user input "z" is the right call.
opt-level = "z"

[profile.dev]
# Reduce debug info in dev builds from full (2) to line tables only (1).
# No effect on the running app — you can still set breakpoints — but the
# compiled artefacts in target/debug/ are significantly smaller, which
# matters for contributors working with limited disk space.
debug = 1
# Keep incremental on (the default) so repeated dev builds stay fast.
incremental = true

